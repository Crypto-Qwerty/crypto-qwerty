name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    name: Node.js tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '24.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install test dependencies
        working-directory: tests
        run: npm install --no-audit --no-fund
      - name: Run Node.js test suite
        working-directory: tests
        run: npm test
      - name: Verify Service Worker precache manifest
        working-directory: tests
        run: npm run test:precache

  python-verification:
    name: Independent Python HMAC verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify HMAC RNG and board vectors
        run: python tests/run-python-tests.py

  browser-tests:
    name: Chromium browser and offline tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: Install test dependencies
        working-directory: tests
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: tests
        run: npm run test:browser
