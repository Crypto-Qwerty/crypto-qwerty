name: Security Analysis

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '29 16 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: "CodeQL (${{ matrix.language }})"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript, python]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  semgrep:
    name: Semgrep Security Audit
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.186.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run Semgrep Community Edition
        run: semgrep scan --config p/security-audit --error .
        env:
          SEMGREP_SEND_METRICS: "off"

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: Install test dependencies for dependency inspection
        working-directory: tests
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Scan dependencies and configuration
        uses: aquasecurity/trivy-action@0.36.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
      - name: Upload Trivy findings to GitHub Code Scanning
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-filesystem

  osv-scanner:
    name: OSV-Scanner Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: Install test dependencies for dependency inspection
        working-directory: tests
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Scan dependency tree against OSV
        uses: google/osv-scanner-action/osv-scanner-action@0e457b42d0120153c352875e9b758b1e5c58c7e5
        with:
          scan-args: |-
            --recursive
            ./
